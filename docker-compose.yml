services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      - APP_ENV=local

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: Ar0126#00
      MYSQL_DATABASE: microblog
      MYSQL_USER: user
      MYSQL_PASSWORD: User1212#
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: